<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123859"><title>Jugendcollege | Bewerbungswerkstatt 2.0</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#163047;background:#f3f7fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#103a59,#126b7b);color:white;padding:25px max(18px,calc((100vw - 990px)/2))}header h1{margin:7px 0;font-size:clamp(25px,4vw,36px)}header p{margin:4px 0;color:#d3e5f1}.wrap{max-width:990px;margin:auto;padding:22px 16px 65px}.panel{background:white;border-radius:18px;padding:clamp(16px,3vw,28px);box-shadow:0 5px 24px #20466512;margin-top:18px;line-height:1.55}.muted{color:#547084}.small{font-size:14px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tabs button{flex:1;min-width:130px}.btn,button{font:inherit;border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.btn{background:#126b88;color:white;font-weight:700}.btn:hover{background:#0f5770}.btn.secondary{background:#e9f1f6;color:#18445e}.btn:disabled{opacity:.45;cursor:not-allowed}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.progress{height:10px;background:#e7edf2;border-radius:20px;overflow:hidden;margin:16px 0}.progress>div{height:100%;background:#23a18f;transition:width .2s}textarea,input,select{font:inherit;width:100%;padding:12px;border:1px solid #becdd7;border-radius:9px;background:#fff}textarea{min-height:145px;resize:vertical}label.field{font-weight:650;display:block;margin:18px 0 8px}.question{border-bottom:1px solid #e6ebef;padding:16px 0}.question strong{display:block;margin-bottom:9px}.choices{display:flex;gap:9px;flex-wrap:wrap}.choices label{cursor:pointer;margin:0;font-size:14px;font-weight:500;border:1px solid #c7d5dd;padding:10px;border-radius:8px}.choices label:has(input:checked){border-color:#158d82;background:#e7f8f4}.choices input{width:auto}.hint{margin:5px 0;color:#5b7180;font-size:14px}.score{font-size:54px;font-weight:800;margin:0;color:#155c7a}.bar{height:8px;background:#e9edf1;border-radius:20px;overflow:hidden}.bar>div{background:#198e91;height:100%}.result-row{margin:17px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.pill{display:inline-block;background:#dceef6;color:#0e5771;border-radius:100px;padding:6px 10px;font-size:13px;font-weight:700}.notice{background:#eff8f8;border-left:4px solid #1b9491;padding:14px;border-radius:8px;margin:15px 0}.warning{background:#fff7e9;border-left-color:#e1a02f}.danger{color:#ab4039}.letter{white-space:pre-wrap;font-family:Arial,sans-serif;line-height:1.65;color:#172c3d;padding:20px;border:1px solid #dee5eb;border-radius:10px;background:white;min-height:120px}.result-card{border:1px solid #dae4eb;border-radius:12px;padding:16px;margin:14px 0}.footer{color:#5a7180;font-size:13px;margin:14px 0;text-align:center}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffb24a;outline-offset:2px}@media print{@page{size:A4;margin:19mm}header,.tabs,.nav,.actions,.no-print,.footer{display:none!important}body{background:white}.panel{box-shadow:none;padding:0;margin:0}.wrap{padding:0;max-width:none}.letter{border:0;padding:0;font-size:11pt}.result-card{break-inside:avoid}}
</style></head><body><header><span class="pill">Jugendcollege · Bewerbungswerkstatt</span><h1>Dein Weg zur Bewerbung</h1><p>Persönlich · klar · für Smartphone und PC</p></header><main class="wrap"><nav class="tabs no-print" aria-label="Hauptnavigation"><button id="tab-coach" class="btn" onclick="showTab('coach')">✍️ Bewerbungscoach</button><button id="tab-check" class="btn secondary" onclick="showTab('check')">✅ Bewerbungscheck</button><button id="tab-about" class="btn secondary" onclick="showTab('about')">ℹ️ Anleitung</button></nav><section class="panel" id="view" aria-live="polite"></section><p class="footer no-print">Keine Registrierung. Keine Speicherung auf einem App-Server. Teile keine SV-Nummern oder vertraulichen Daten.</p></main><script>
'use strict';
const phases=[['Über mich','Wie alt bist du und wie lange lebst du schon in Österreich?','Du musst deine Herkunft nicht nennen.'],['Schule und Sprache','Welchen Schulabschluss hast du? Wie gut sprichst du Deutsch (z. B. ÖIF B1 oder B2)?','Schreibe nur, was wirklich stimmt.'],['Meine Stärken','Was kannst du besonders gut? Nenne zwei oder drei Stärken und ein echtes Beispiel.','Zum Beispiel aus Schule, Sport oder einem Projekt.'],['Meine Motivation','Welchen Lehrberuf oder welche Stelle suchst du? Warum interessiert dich dieser Beruf?','Erkläre deine Motivation in deinen eigenen Worten.'],['Meine Erfahrungen','Hast du Praktika, Arbeitserfahrungen, Schulprojekte oder hilfreiche Erfahrungen aus dem Alltag?','Auch Freizeit und Ehrenamt zählen.'],['Mein Wunschbetrieb','Wie heißt die Firma? Kopiere die Stellenausschreibung hier hinein, wenn du sie hast.','Ohne Stellenausschreibung wird die Bewerbung allgemeiner.'],['Mein persönlicher Abschluss','Was sollte der Betrieb unbedingt noch über dich wissen?','Was macht gerade diesen Betrieb für dich interessant?']];
const groups=[['Vollständigkeit',['Meine Kontaktdaten sind vorhanden.','Der richtige Betrieb und die richtige Stelle werden genannt.','Ich habe einen aktuellen Lebenslauf.','Mein Schreiben hat Anrede und Grußformel.']],['Persönlichkeit und Stärken',['Ich erkläre, warum mich der Beruf interessiert.','Ich nenne mindestens zwei echte Stärken.','Ich gebe ein konkretes Beispiel für eine Stärke.','Meine Bewerbung klingt nach mir.']],['Passung zum Unternehmen',['Ich habe die Stellenanzeige gelesen.','Ich erkläre, warum ich zu diesem Betrieb möchte.','Ich gehe auf eine Anforderung des Inserats ein.','Ich habe Texte anderer Unternehmen entfernt.']],['Sprache und Gestaltung',['Meine Sätze sind klar und verständlich.','Ich habe Rechtschreibung und Grammatik geprüft.','Das Schreiben passt auf eine A4-Seite.','Die Bewerbung sieht übersichtlich aus.']],['Bereit zum Versand',['Alle Angaben sind wahr.','Schulabschluss und Sprachkenntnisse stimmen.','Anhänge und Dateinamen habe ich geprüft.','Eine kurze Bewerbungs-E-Mail ist vorbereitet.']]];
const state={tab:'coach',step:0,answers:Array(7).fill(''),group:0,ratings:{},role:'Lehrstelle',job:'',company:'',letter:'',email:'',feedback:'',level:'B1',improvements:''};
const view=document.querySelector('#view');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showTab(t){state.tab=t;document.querySelectorAll('.tabs button').forEach(x=>x.className='btn secondary');document.querySelector('#tab-'+t).className='btn';render()}
function progress(n,total){return `<div class="progress"><div style="width:${n/total*100}%"></div></div>`}
function promptText(){return `Erstelle eine individuelle, authentische Lehrstellen- oder Jobbewerbung in Österreich in einfacher, natürlicher Sprache (etwa B1/B2). Maximal eine A4-Seite. Verwende keine erfundenen Angaben. Stelle bei entscheidenden Lücken zunächst Fragen. Meine Informationen:\n`+phases.map((p,i)=>p[0]+': '+(state.answers[i]||'Keine Angabe')).join('\n')+'\nSchreibe eine Bewerbung und eine kurze Bewerbungs-E-Mail.'}
function coach(){const i=state.step;if(i===7){view.innerHTML=`<h2>Deine Bewerbung erstellen</h2><p class="muted">Du hast alle sieben Schritte bearbeitet. Mit der KI-Funktion kannst du direkt einen Bewerbungsvorschlag erstellen. Prüfe ihn anschließend sorgfältig.</p><div class="actions no-print"><button class="btn" id="generate" onclick="generateLetter()">✨ Bewerbung mit KI erstellen</button><button class="btn secondary" onclick="copyText(promptText())">📋 Auftrag für ChatGPT kopieren</button><button class="btn secondary" onclick="state.step=6;render()">← Angaben ändern</button></div><div id="ai-message" role="status" class="hint"></div><div id="letter-area"></div>`;displayLetter();return}let p=phases[i];view.innerHTML=`<span class="pill">Schritt ${i+1} von 7</span>${progress(i+1,7)}<h2>${esc(p[0])}</h2><p class="intro">${esc(p[1])}</p><p class="hint">${esc(p[2])}</p><label class="field" for="answer">Deine Antwort</label><textarea id="answer" maxlength="7000" placeholder="Schreibe in deinen eigenen Worten. Einfache Sätze reichen aus.">${esc(state.answers[i])}</textarea><div class="nav"><button class="btn secondary" ${i===0?'disabled':''} onclick="saveAnswer();state.step--;render()">← Zurück</button><button class="btn" onclick="saveAnswer();state.step++;render()">${i===6?'Bewerbung erstellen →':'Weiter →'}</button></div>`}
function saveAnswer(){state.answers[state.step]=document.querySelector('#answer')?.value||''}
async function copyText(s){try{await navigator.clipboard.writeText(s);alert('Text kopiert.')}catch{let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove();alert('Text kopiert.')}}
function displayLetter(){let a=document.querySelector('#letter-area');if(!a)return;if(!state.letter){a.innerHTML='<div class="notice">Falls die KI-Anbindung noch nicht eingerichtet ist, kannst du den vorbereiteten Auftrag kopieren und in ChatGPT verwenden.</div>';return}a.innerHTML=`<div class="result-card"><h3>Bewerbungsvorschlag</h3><div id="print-letter" class="letter">${esc(state.letter)}</div><div class="actions no-print"><button class="btn secondary" onclick="copyText(state.letter)">📋 Kopieren</button><button class="btn" onclick="printSection('letter')">📄 Als PDF speichern</button></div></div><div class="result-card"><h3>Bewerbungs-E-Mail</h3><div class="letter">${esc(state.email)}</div><div class="actions no-print"><button class="btn secondary" onclick="copyText(state.email)">📋 E-Mail kopieren</button></div></div><div class="notice"><strong>Wichtig:</strong> Die KI kann Fehler machen. Kontrolliere Namen, Erfahrungen, Sprachkenntnisse und Stellenangaben vor dem Versand. Ergänze Kontaktdaten selbst.</div>`}
async function callAI(mode,payload){const r=await fetch('/.netlify/functions/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,...payload})});let d;try{d=await r.json()}catch{throw Error('Der KI-Dienst hat keine gültige Antwort gesendet.')}if(!r.ok)throw Error(d.error||'KI momentan nicht verfügbar.');return d}
async function generateLetter(){let b=document.querySelector('#generate'),m=document.querySelector('#ai-message');b.disabled=true;b.textContent='Erstelle Bewerbung …';m.textContent='Deine Angaben werden zur Erstellung an den KI-Dienst übertragen.';try{let d=await callAI('letter',{answers:state.answers});state.letter=d.letter||'';state.email=d.email||'';if(!state.letter)throw Error('Keine Bewerbung erhalten.');m.textContent='Dein Bewerbungsvorschlag wurde erstellt.';displayLetter()}catch(e){m.textContent='KI-Funktion noch nicht verfügbar: '+e.message+' Du kannst den Auftrag weiterhin kopieren.'}finally{b.disabled=false;b.textContent='✨ Bewerbung mit KI erstellen'}}
function check(){let g=state.group;if(g===0){view.innerHTML=`<h2>Bewerbungscheck: Ist deine Bewerbung bereit?</h2><p class="intro">Beantworte 20 einfache Fragen. Du bekommst eine Auswertung von 0 bis 100 Punkten und konkrete Tipps.</p><label class="field" for="role">Art der Bewerbung</label><select id="role"><option>Lehrstelle</option><option>Arbeitsstelle</option><option>Praktikum</option></select><label class="field" for="job">Beruf</label><input id="job" placeholder="z. B. Kfz-Technikerin" value="${esc(state.job)}"><label class="field" for="company">Unternehmen (freiwillig)</label><input id="company" value="${esc(state.company)}" placeholder="Name des Betriebs"><div class="actions"><button class="btn" onclick="startCheck()">Check starten →</button></div>`;document.querySelector('#role').value=state.role;return}if(g===6){showResult();return}let item=groups[g-1];view.innerHTML=`<span class="pill">Bereich ${g} von 5</span>${progress(g,5)}<h2>${esc(item[0])}</h2><p class="muted">Wähle: Ja (5 Punkte), Teilweise (2,5 Punkte) oder Nein (0 Punkte).</p>${item[1].map((q,j)=>`<div class="question"><strong>${(g-1)*4+j+1}. ${esc(q)}</strong><div class="choices">${[['2','Ja'],['1','Teilweise'],['0','Nein']].map(([v,t])=>`<label><input type="radio" name="q${j}" value="${v}" ${state.ratings[(g-1)+'-'+j]===v?'checked':''} onchange="state.ratings['${g-1}-${j}']='${v}'"> ${t}</label>`).join('')}</div></div>`).join('')}<div class="nav"><button class="btn secondary" onclick="state.group--;render()">← Zurück</button><button class="btn" onclick="nextCheck()">${g===5?'Ergebnis anzeigen':'Weiter'} →</button></div>`}
function startCheck(){state.role=document.querySelector('#role').value;state.job=document.querySelector('#job').value;state.company=document.querySelector('#company').value;state.group=1;render()}
function nextCheck(){let i=state.group-1;if(groups[i][1].some((q,j)=>state.ratings[i+'-'+j]===undefined)){alert('Bitte beantworte alle vier Fragen.');return}state.group++;render()}
function checkData(){const totals=groups.map((x,i)=>x[1].reduce((s,q,j)=>s+Number(state.ratings[i+'-'+j]||0)*2.5,0));const total=totals.reduce((a,b)=>a+b,0);const missing=groups.flatMap((x,i)=>x[1].map((q,j)=>({category:x[0],q,value:state.ratings[i+'-'+j]}))).filter(x=>x.value!=='2');return {totals,total,missing}}
function showResult(){const {totals,total,missing}=checkData();let grade=total>=85?'Sehr gut vorbereitet':total>=65?'Gute Grundlage':total>=40?'Noch verbessern':'Hier gibt es noch einiges zu tun';view.innerHTML=`<h2>Dein persönliches Ergebnis</h2><p class="score">${total.toLocaleString('de-AT')} / 100</p><h3>${grade}</h3><p class="muted">Diese Punkte sind deine Selbsteinschätzung und keine automatische Prüfung deiner Unterlagen.</p>${groups.map((x,i)=>`<div class="result-row"><strong>${esc(x[0])}: ${totals[i].toLocaleString('de-AT')}/20</strong><div class="bar"><div style="width:${totals[i]*5}%"></div></div></div>`).join('')}<h3>Dein persönlicher Verbesserungsplan</h3>${missing.length?`<ol>${missing.map(x=>`<li>${esc(x.q)} – <strong>${x.value==='0'?'noch offen':'teilweise erfüllt'}</strong></li>`).join('')}</ol>`:'<p>Du hast alle Fragen mit Ja beantwortet. Prüfe vor dem Versand alles noch einmal.</p>'}<div id="ai-feedback">${state.feedback?`<div class="notice">${esc(state.feedback).replaceAll('\n','<br>')}</div>`:''}</div><div class="actions no-print"><button class="btn" id="improve" onclick="generateFeedback()">✨ Individuelle KI-Tipps</button><button class="btn secondary" onclick="printSection('check')">📄 Auswertung als PDF</button><button class="btn secondary" onclick="state.group=5;render()">← Antworten ändern</button><button class="btn secondary" onclick="state.group=0;state.ratings={};state.feedback='';render()">Neuer Check</button></div><p id="feedback-message" role="status" class="hint"></p>`}
async function generateFeedback(){const {totals,total,missing}=checkData();const b=document.querySelector('#improve'),m=document.querySelector('#feedback-message');b.disabled=true;m.textContent='Dein Verbesserungsplan wird erstellt …';try{let d=await callAI('feedback',{role:state.role,job:state.job,company:state.company,total,sections:groups.map((g,i)=>({name:g[0],points:totals[i]})),missing});state.feedback=d.feedback||'';m.textContent='Individuelle Tipps sind bereit.';document.querySelector('#ai-feedback').innerHTML='<div class="notice">'+esc(state.feedback).replaceAll('\n','<br>')+'</div>'}catch(e){m.textContent='KI derzeit nicht verfügbar: '+e.message+' Die persönliche Punkteauswertung oben funktioniert trotzdem.'}finally{b.disabled=false}}
function printSection(which){document.body.dataset.print=which;if(which==='letter'&&!state.letter){alert('Bitte zuerst einen Bewerbungsvorschlag erstellen.');return}window.print();delete document.body.dataset.print}
function about(){view.innerHTML=`<h2>So funktioniert die Bewerbungswerkstatt</h2><p><strong>Bewerbungscoach:</strong> Sieben Schritte erfassen deine Stärken, Erfahrungen und Motivation. Mit der integrierten KI-Funktion bekommst du einen Bewerbungsvorschlag und eine kurze E-Mail, sobald die KI-Anbindung vom Betreiber aktiviert wurde. Alternativ kannst du deinen Auftrag kopieren.</p><p><strong>Bewerbungscheck:</strong> Mit 20 Fragen kontrollierst du deine Bewerbung. Du bekommst eine detaillierte Punkteauswertung und konkrete Verbesserungen; optionale KI-Tipps erweitern das Ergebnis.</p><p><strong>PDF erstellen:</strong> Klicke auf „Als PDF speichern“. Im Druckfenster wählst du „Als PDF speichern“ statt eines Druckers.</p><div class="notice warning"><strong>Datenschutz:</strong> Deine Antworten werden in dieser App nur vorübergehend im geöffneten Browser gehalten. Beim Neuladen gehen sie verloren. Nur wenn du ausdrücklich die KI-Funktion startest, werden die für die Bearbeitung nötigen Angaben an den konfigurierten KI-Dienst übermittelt. Trage keine SV-Nummer, Adresse, Telefonnummer, Ausweisnummer oder vertraulichen Gesundheitsdaten ein. Die Nutzung externer KI ist freiwillig; sprich bei Unsicherheit mit deiner Trainerin oder deinem Trainer.</div><p><strong>Für Trainerinnen und Trainer:</strong> Die KI-Funktion benötigt eine serverseitige Netlify Function und einen sicher gesetzten API-Schlüssel. Auch ohne diese Anbindung funktionieren der Check, die Bewertung und das Kopieren des Bewerbungsauftrags.</p>`}
function render(){state.tab==='coach'?coach():state.tab==='check'?check():about()}render();
</script><style>@media print{body[data-print="letter"] .result-card:not(:has(#print-letter)),body[data-print="letter"] .panel>h2,body[data-print="letter"] .panel>p,body[data-print="letter"] #ai-message,body[data-print="letter"] .notice{display:none!important}body[data-print="letter"] .result-card:has(#print-letter){border:0;padding:0}body[data-print="check"] #ai-feedback{display:block}}</style></body></html>
